<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Список задач (To-Do List) на Vue 3 и TypeScript" />
    <title>Список задач</title>

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Тема применяется до отрисовки, чтобы не было мигания светлой темой. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('todo-vue.theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
